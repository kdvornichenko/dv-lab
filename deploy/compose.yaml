name: dv-lab

x-logging: &logging
  driver: local
  options:
    max-size: '10m'
    max-file: '3'

services:
  caddy:
    image: caddy:2.11.7
    restart: unless-stopped
    logging: *logging
    ports:
      - '80:80'
      - '443:443'
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    volumes:
      - ./caddy:/etc/caddy:ro
      - /opt/dv-lab/data/caddy/data:/data
      - /opt/dv-lab/data/caddy/config:/config
    depends_on:
      - web
      - api

  web:
    image: ghcr.io/kdvornichenko/dv-lab-web:${APP_TAG:?}
    restart: unless-stopped
    init: true
    logging: *logging
    mem_limit: 512m
    healthcheck:
      test:
        ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  api:
    image: ghcr.io/kdvornichenko/dv-lab-api:${APP_TAG:?}
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    logging: *logging
    environment:
      NODE_ENV: production
      PORT: '4000'
      APP_ORIGIN: https://dv-lab.dev
      LOG_LEVEL: info
      SHUTDOWN_DEADLINE_MS: '10000'
      DATABASE_URL: postgresql://dvlab_app:${APP_PASSWORD:?}@db:5432/dvlab
    mem_limit: 512m
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/healthz').then((r)=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  migrate:
    image: ghcr.io/kdvornichenko/dv-lab-api:${APP_TAG:?}
    profiles: ['tools']
    restart: 'no'
    logging: *logging
    command: ['node', 'apps/api/dist/migrate.mjs']
    environment:
      MIGRATOR_DATABASE_URL: postgresql://dvlab_migrator:${MIGRATOR_PASSWORD:?}@db:5432/${MIGRATE_DB:-dvlab}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    restart: unless-stopped
    logging: *logging
    env_file: /opt/dv-lab/env/db.env
    environment:
      POSTGRES_USER: postgres
      APP_DB_NAME: dvlab
    volumes:
      - /opt/dv-lab/data/pg:/var/lib/postgresql
      - ./postgres:/deploy/postgres:ro
      - ./postgres/ensure-db.sh:/docker-entrypoint-initdb.d/10-ensure-db.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres']
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd00:d1ab:1::/64
