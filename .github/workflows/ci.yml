name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - 'gsd/phase-*'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Legacy code check
        run: |
          rc=0
          git grep -n -i -E 'supa[b]ase' -- . ':(exclude).planning' || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "legacy references found or git grep failed"
            exit 1
          fi

      - name: Web and api boundary
        run: |
          if [ -e apps/web/app/api ]; then
            echo "apps/web/app/api must not exist: api routes live in apps/api"
            exit 1
          fi
          node -e "const p = require('./apps/web/package.json'); const all = { ...p.dependencies, ...p.devDependencies, ...p.peerDependencies, ...p.optionalDependencies }; const bad = ['@dv-lab/api', '@dv-lab/db'].filter((name) => name in all); if (bad.length) { console.error('apps/web must not depend on ' + bad.join(', ')); process.exit(1) }"
          none() {
            local rc=0
            git grep -n "$@" || rc=$?
            [ "$rc" -eq 1 ]
          }
          if ! none -E "['\"]@dv-lab/(api|db)(/[^'\"]*)?['\"]" -- apps/web; then
            echo "apps/web must not import @dv-lab/api or @dv-lab/db"
            exit 1
          fi
          if ! none -F transpilePackages -- apps/web/next.config.ts; then
            echo "apps/web/next.config.ts must not set transpilePackages"
            exit 1
          fi
          node -e "const p = require('./packages/contracts/package.json'); const deps = Object.keys(p.dependencies ?? {}); if (deps.length !== 1 || deps[0] !== 'zod') { console.error('packages/contracts must depend only on zod, found: ' + deps.join(', ')); process.exit(1) }"
          if ! none -E "['\"](pg(/[^'\"]*)?|node:[^'\"]*|@dv-lab/[^'\"]*)['\"]" -- packages/contracts/src; then
            echo "packages/contracts/src must not import pg, node:* or @dv-lab/*"
            exit 1
          fi
          if ! none -F process.env -- packages/contracts/src; then
            echo "packages/contracts/src must not read process.env"
            exit 1
          fi
          node -e "const p = require('./packages/core/package.json'); const deps = Object.keys({ ...p.dependencies, ...p.peerDependencies, ...p.optionalDependencies }); if (deps.length) { console.error('packages/core must have no dependencies, found: ' + deps.join(', ')); process.exit(1) }"
          if ! none -E "['\"](pg(/[^'\"]*)?|node:[^'\"]*|@dv-lab/[^'\"]*)['\"]" -- packages/core/src; then
            echo "packages/core/src must not import pg, node:* or @dv-lab/*"
            exit 1
          fi
          if ! none -F process.env -- packages/core/src; then
            echo "packages/core/src must not read process.env"
            exit 1
          fi

      - name: Repository hygiene
        run: node scripts/hygiene-check.mjs

      - name: Client address trust
        run: |
          test -f deploy/caddy/Caddyfile
          test -f deploy/compose.yaml
          if grep -n trusted_proxies deploy/caddy/Caddyfile; then
            echo "deploy/caddy/Caddyfile must not set trusted_proxies: api takes the client address from the X-Forwarded-For value Caddy appends"
            exit 1
          fi
          api_ports=$(awk '/^[^ #]/ { top = $1 } /^  [^ #]/ { svc = (top == "services:") ? $1 : "" } svc == "api:" && /^    ports:/ { print }' deploy/compose.yaml)
          if [ -n "$api_ports" ]; then
            echo "the api service in deploy/compose.yaml must not publish ports: clients reach it only through Caddy"
            exit 1
          fi
          ipv6=$(awk '/^[^ #]/ { top = $1 } /^  [^ #]/ { net = (top == "networks:") ? $1 : "" } net == "default:" && /^    enable_ipv6: true$/ { print "yes" }' deploy/compose.yaml)
          if [ "$ipv6" != yes ]; then
            echo "the default network in deploy/compose.yaml must have enable_ipv6: true, otherwise Caddy sees the Docker gateway instead of IPv6 clients"
            exit 1
          fi

      - name: Turbo version in Dockerfiles
        run: |
          node -e "const fs = require('node:fs'); const version = require('./package.json').devDependencies.turbo; const bad = ['apps/api/Dockerfile', 'apps/web/Dockerfile'].filter((file) => !fs.readFileSync(file, 'utf8').split('\n').includes('ARG TURBO_VERSION=' + version)); if (bad.length) { console.error('ARG TURBO_VERSION differs from turbo ' + version + ' in package.json: ' + bad.join(', ')); process.exit(1) }"

      - uses: ./.github/actions/setup
        with:
          turbo-scope: checks

      - run: yarn typecheck
      - run: yarn lint
      - run: yarn knip

      - name: Caddyfile
        run: docker run --rm -v "$PWD/deploy/caddy:/etc/caddy:ro" caddy:2.11.7 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Shell scripts
        run: |
          for f in deploy/*.sh deploy/*/*.sh; do
            bash -n "$f"
          done
          shellcheck -S warning deploy/*.sh deploy/*/*.sh

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-superuser-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: ci-superuser-password
      DATABASE_URL: postgresql://dvlab_app:ci-app-password@127.0.0.1:5432/dvlab_test
      MIGRATOR_DATABASE_URL: postgresql://dvlab_migrator:ci-migrator-password@127.0.0.1:5432/dvlab_test
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          turbo-scope: test

      - name: Prepare roles and database
        run: |
          for pass in 1 2; do
            echo "ensure-db.sql pass $pass"
            psql -X -v ON_ERROR_STOP=1 -d postgres -v db_name=dvlab_test -v migrator_password=ci-migrator-password -v app_password=ci-app-password -f deploy/postgres/ensure-db.sql
          done

      - name: Migrations are in sync with the schema
        run: |
          yarn db:generate
          changes=$(git status --porcelain --untracked-files=all -- packages/db/drizzle)
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "packages/db/drizzle is out of sync with the schema: run yarn db:generate and commit the result"
            exit 1
          fi

      - run: yarn db:migrate
      - run: yarn test
      - run: yarn turbo run build --filter=!@dv-lab/web

  base:
    name: Base is master
    if: github.event_name == 'pull_request' && github.base_ref != 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: |
          echo "A pull request must target master. A stacked pull request merged into another branch never reaches master: open each pull request of a chain against master."
          exit 1

  web:
    name: Image web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          turbo-scope: web

      - uses: actions/cache@v6
        with:
          path: apps/web/.next/cache
          key: next-${{ hashFiles('yarn.lock') }}-${{ github.sha }}
          restore-keys: |
            next-${{ hashFiles('yarn.lock') }}-
            next-

      - run: yarn turbo run build --filter=@dv-lab/web

      - name: Image context
        run: |
          mkdir -p .image
          cp -a apps/web/.next/standalone .image/standalone
          cp -a apps/web/.next/static .image/static
          cp -a apps/web/public .image/public

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .image
          file: apps/web/Dockerfile.runtime
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository_owner }}/dv-lab-web:ci-${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}

  api:
    name: Image api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository_owner }}/dv-lab-api:ci-${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  publish:
    name: Publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [checks, test, web, api]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the checked images for deploy
        run: |
          for app in web api; do
            image=ghcr.io/${{ github.repository_owner }}/dv-lab-$app
            docker buildx imagetools create -t "$image:sha-${{ github.sha }}" "$image:ci-${{ github.sha }}"
            docker buildx imagetools inspect "$image:sha-${{ github.sha }}"
          done
